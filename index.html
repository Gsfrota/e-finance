    <style>
      #app-boot-screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0f1d33;
        color: #f0f4ff;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #app-boot-card {
        width: min(100%, 440px);
        padding: 36px 28px;
        border: 1px solid rgba(148, 180, 255, 0.18);
        border-radius: 28px;
        background: #172540;
        box-shadow: 0 24px 60px rgba(4, 6, 10, 0.28);
        text-align: center;
      }
      #app-boot-mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #f0b429;
        color: #17120b;
        font-size: 24px;
        font-weight: 800;
      }
      #app-boot-title { margin: 0; font-size: 24px; line-height: 1.2; }
      #app-boot-copy { margin: 12px auto 0; max-width: 340px; color: #a8b8d8; font-size: 14px; line-height: 1.6; }
      #app-boot-recover {
        margin-top: 24px;
        min-height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: #f0b429;
        color: #17120b;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
      }
      #app-boot-recover[hidden] { display: none; }
      #app-boot-recover:disabled { cursor: wait; opacity: 0.65; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root">
      <div id="app-boot-screen" data-testid="pre-react-fallback" role="status" aria-live="polite">
        <div id="app-boot-card">
          <div id="app-boot-mark" aria-hidden="true">J</div>
          <h1 id="app-boot-title">Abrindo sua operação</h1>
          <p id="app-boot-copy">Carregando os dados com segurança. Isso pode levar alguns segundos.</p>
          <button id="app-boot-recover" type="button" hidden onclick="window.__EF_RECOVER_APP__(this)">
            Limpar cache e tentar novamente
          </button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var bootTimer;

        function getBootScreen() {
          return document.getElementById('app-boot-screen');
        }

        window.__EF_SHOW_BOOT_ERROR__ = function (reason) {
          var screen = getBootScreen();
          if (!screen) return;

          window.clearTimeout(bootTimer);
          screen.setAttribute('role', 'alert');
          screen.setAttribute('data-state', 'error');
          document.getElementById('app-boot-title').textContent = 'Não foi possível abrir o sistema';
          document.getElementById('app-boot-copy').textContent =
            'Uma versão antiga pode ter ficado salva neste aparelho. Limpe o cache do aplicativo e tente novamente.';
          document.getElementById('app-boot-recover').hidden = false;
          console.error('[AppBootstrap]', reason || 'Falha antes da montagem do React');
        };

        window.__EF_RECOVER_APP__ = async function (button) {
          button.disabled = true;
          button.textContent = 'Limpando…';

          try {
            var tasks = [];
            if ('caches' in window) {
              tasks.push(caches.keys().then(function (names) {
                return Promise.all(names.map(function (name) { return caches.delete(name); }));
              }));
            }
            if ('serviceWorker' in navigator) {
              tasks.push(navigator.serviceWorker.getRegistrations().then(function (registrations) {
                return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
              }));
            }
            await Promise.all(tasks);
          } catch (error) {
            console.error('[AppRecovery]', error);
          }

          var nextUrl = new URL(window.location.href);
          nextUrl.searchParams.set('_recover', String(Date.now()));
          window.location.replace(nextUrl.toString());
        };

        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && target.tagName === 'SCRIPT' && target.getAttribute('type') === 'module') {
            window.__EF_SHOW_BOOT_ERROR__('Falha ao carregar o bundle principal');
            return;
          }
          if (event.error && getBootScreen()) {
            window.__EF_SHOW_BOOT_ERROR__(event.error.message);
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          if (getBootScreen()) {
            window.__EF_SHOW_BOOT_ERROR__('Falha assíncrona durante a inicialização');
          }
        });

        bootTimer = window.setTimeout(function () {
          if (getBootScreen()) {
            window.__EF_SHOW_BOOT_ERROR__('Tempo limite excedido durante a inicialização');
          }
        }, 15000);
      }());
    </script>
    <!-- Runtime env vars injetados pelo docker-entrypoint.sh (Cloud Run) -->

  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' })
          .then(function (registration) { return registration.update(); })
          .catch(function (error) { console.error('[ServiceWorker]', error); });
      });
    }
  </script>
