name: Frontend CI and Vercel Verification

on:
  push:
    branches: [main]
    paths-ignore:
      - 'e-finance-bot/**'
      - 'README.md'
      - 'docs/**'
      - '*.md'

concurrency:
  group: frontend-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: E2E Tests (Critical Gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build app (com credenciais Supabase)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Injetar credenciais Supabase no env-config.js (CI preview)
        run: |
          printf 'window._env_ = {\n  SUPABASE_URL: "%s",\n  SUPABASE_ANON_KEY: "%s"\n};\n' \
            "${{ secrets.VITE_SUPABASE_URL }}" \
            "${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            > dist/env-config.js
          echo "env-config.js atualizado para CI preview"

      - name: Install Playwright + Chromium
        run: npx playwright install chromium --with-deps

      - name: "Tier -1: Frontend resilience (isolated, no production writes)"
        run: npm run test:resilience
        env:
          RESILIENCE_SKIP_BUILD: "1"
          PLAYWRIGHT_JSON_TIER: resilience

      - name: Start preview server
        run: npx vite preview --port 4173 &

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:4173 > /dev/null && echo "Servidor pronto" && break
            echo "Aguardando servidor... ($i/15)"
            sleep 2
          done

      - name: Criar .env.local a partir dos secrets
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local
          echo "TEST_ADMIN_EMAIL=${{ secrets.TEST_ADMIN_EMAIL }}" >> .env.local
          echo "TEST_ADMIN_PASSWORD=${{ secrets.TEST_ADMIN_PASSWORD }}" >> .env.local

      - name: Auth setup (login admin)
        run: npx playwright test --project=setup --reporter=list

      - name: "Tier 0: DB schema smoke test (BR-PAG-021 late_auto)"
        run: |
          # Verifica que a função EXISTS no banco (não a executa — execução toca dados reais).
          # 200/204 = sucesso, 400/422 = função existe mas erro de dados (constraint etc),
          # 404 = função não existe (migration ausente) → falha.
          RESPONSE=$(curl -s -X POST "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/rpc/update_overdue_installments" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -w "\n%{http_code}")
          RESULT=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP $RESULT — $BODY"
          if [ "$RESULT" = "404" ]; then
            echo "❌ update_overdue_installments NÃO EXISTE — migration v39 não foi aplicada"
            exit 1
          elif [ "$RESULT" = "500" ]; then
            echo "❌ Erro interno do servidor (HTTP 500)"
            exit 1
          else
            echo "✅ update_overdue_installments existe (HTTP $RESULT)"
          fi

      - name: "Tier 1: Smoke tests (navegação e carregamento)"
        id: tier1
        run: >
          npx playwright test e2e/e2e-full/smoke.spec.ts
          --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_JSON_TIER: tier1

      - name: "Tier 2: Core business tests (login, admin, contratos, pagamentos)"
        id: tier2
        run: >
          npx playwright test
          e2e/auth/
          e2e/edge-cases.spec.ts
          e2e/admin/
          e2e/contract/
          e2e/reports/
          e2e/system/
          e2e/e2e-full/client-management.spec.ts
          e2e/e2e-full/contract-creation.spec.ts
          e2e/e2e-full/payment-flows.spec.ts
          e2e/payment/
          --project=chromium
          --project=no-auth
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_JSON_TIER: tier2

      - name: Relatório Telegram (resultados + screenshots)
        if: always()
        run: bash scripts/ci/telegram-report.sh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "7354814208"
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload relatório de falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  verify-vercel:
    name: Verify Vercel Production
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm successful Vercel status
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            vercel_state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/statuses" \
              --jq '[.[] | select(.context == "Vercel")][0].state // "pending"')
            vercel_target=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/statuses" \
              --jq '[.[] | select(.context == "Vercel")][0].target_url // ""')

            echo "Vercel: ${vercel_state} (${attempt}/30) ${vercel_target}"
            if [ "${vercel_state}" = "success" ]; then
              echo "✅ Deploy Vercel concluído para ${COMMIT_SHA}"
              exit 0
            fi
            if [ "${vercel_state}" = "failure" ] || [ "${vercel_state}" = "error" ]; then
              echo "❌ Deploy Vercel falhou: ${vercel_target}"
              exit 1
            fi
            sleep 10
          done

          echo "❌ Timeout aguardando o status da Vercel"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium
        run: npx playwright install chromium --with-deps

      - name: Test published production without real Supabase access
        run: npm run test:production:resilience
        env:
          FRONTEND_PRODUCTION_URL: https://e-finance-eight.vercel.app
          PLAYWRIGHT_JSON_TIER: production-resilience
