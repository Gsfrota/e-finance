name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - 'e-finance-bot/**'

env:
  PROJECT_ID: tribal-pillar-476701-a3
  REGION: us-west1
  SERVICE: e-finance
  IMAGE: us-west1-docker.pkg.dev/tribal-pillar-476701-a3/cloud-run-source-deploy/e-finance

jobs:
  test:
    name: E2E Tests (Critical Gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app (com credenciais Supabase)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Injetar credenciais Supabase no env-config.js (CI preview)
        run: |
          # Em produção, docker-entrypoint.sh faz isso em runtime.
          # No CI, o vite preview serve dist/ com env-config.js vazio — injetamos aqui.
          cat > dist/env-config.js << 'ENVEOF'
window._env_ = {
  SUPABASE_URL: "PLACEHOLDER_URL",
  SUPABASE_ANON_KEY: "PLACEHOLDER_KEY"
};
ENVEOF
          sed -i "s|PLACEHOLDER_URL|${{ secrets.VITE_SUPABASE_URL }}|g" dist/env-config.js
          sed -i "s|PLACEHOLDER_KEY|${{ secrets.VITE_SUPABASE_ANON_KEY }}|g" dist/env-config.js
          echo "env-config.js atualizado para CI preview"

      - name: Install Playwright + Chromium
        run: npx playwright install chromium --with-deps

      - name: Start preview server
        run: npx vite preview --port 4173 &

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:4173 > /dev/null && echo "Servidor pronto" && break
            echo "Aguardando servidor... ($i/15)"
            sleep 2
          done

      - name: Criar .env.local a partir dos secrets
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local
          echo "TEST_ADMIN_EMAIL=${{ secrets.TEST_ADMIN_EMAIL }}" >> .env.local
          echo "TEST_ADMIN_PASSWORD=${{ secrets.TEST_ADMIN_PASSWORD }}" >> .env.local

      - name: Auth setup (login admin)
        run: npx playwright test --project=setup --reporter=list

      - name: "Tier 0: DB schema smoke test (BR-PAG-021 late_auto)"
        run: |
          RESULT=$(curl -s -X POST "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/rpc/update_overdue_installments" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -w "\n%{http_code}" | tail -1)
          if [ "$RESULT" = "200" ] || [ "$RESULT" = "204" ]; then
            echo "✅ update_overdue_installments respondeu OK (HTTP $RESULT)"
          else
            echo "❌ update_overdue_installments falhou (HTTP $RESULT) — verifique migration v39"
            exit 1
          fi

      - name: "Tier 1: Smoke tests (navegação e carregamento)"
        id: tier1
        run: >
          npx playwright test e2e/e2e-full/smoke.spec.ts
          --project=chromium
          --reporter=list,json
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/tier1-results.json

      - name: "Tier 2: Core business tests (login, admin, contratos, pagamentos)"
        id: tier2
        run: >
          npx playwright test
          e2e/auth/
          e2e/edge-cases.spec.ts
          e2e/admin/
          e2e/e2e-full/client-management.spec.ts
          e2e/e2e-full/contract-creation.spec.ts
          e2e/e2e-full/payment-flows.spec.ts
          e2e/payment/
          --project=chromium
          --project=no-auth
          --reporter=list,json
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/tier2-results.json

      - name: Relatório Telegram (resultados + screenshots)
        if: always()
        run: bash scripts/ci/telegram-report.sh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "7354814208"
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload relatório de falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Build & Deploy
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Docker image
        run: |
          docker build \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: |
            --min-instances=0
            --max-instances=3
            --memory=512Mi
            --cpu=1
            --port=8080
            --remove-env-vars=API_KEY,GEMINI_API_KEY,SUPABASE_SERVICE_ROLE_KEY_EFINANCE
            --update-secrets=SUPABASE_ANON_KEY=SUPABASE_ANON_KEY_EFINANCE:latest,SUPABASE_URL=SUPABASE_URL_EFINANCE:latest

      - name: Show service URL
        run: |
          echo "✅ Deploy concluído!"
          echo "URL: $(gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')"

      - name: Notificar sucesso no Telegram
        if: success()
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')
          MSG="🚀 *Deploy concluído*%0A%0AServiço: \`${{ env.SERVICE }}\`%0ACommit: \`${{ github.sha }}\`%0APor: ${{ github.actor }}%0AURL: ${URL}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=7354814208&text=${MSG}&parse_mode=Markdown" > /dev/null

      - name: Notificar falha no Telegram
        if: failure()
        run: |
          MSG="❌ *Deploy falhou*%0A%0AServiço: \`${{ env.SERVICE }}\`%0ACommit: \`${{ github.sha }}\`%0APor: ${{ github.actor }}%0A%0A🔍 Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=7354814208&text=${MSG}&parse_mode=Markdown" > /dev/null
