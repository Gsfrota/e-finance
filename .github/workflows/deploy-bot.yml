name: Deploy e-finance-bot

on:
  push:
    branches: [main]
    paths:
      - 'e-finance-bot/**'
      - '.github/workflows/deploy-bot.yml'
  workflow_dispatch:

env:
  PROJECT_ID: tribal-pillar-476701-a3
  # Co-localizado com Supabase sa-east-1 — corrige Bug D (cross-region 13-30s
  # de DB read causando session_sync_timeout). Migrado em 2026-05-03.
  REGION: southamerica-east1
  SERVICE: e-finance-bot
  REGISTRY: southamerica-east1-docker.pkg.dev/tribal-pillar-476701-a3/cloud-run-source-deploy/e-finance-bot

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-finance-bot
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e-finance-bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run build

      - name: Run tests
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push image
        working-directory: e-finance-bot
        run: |
          docker build -t ${{ env.REGISTRY }}:${{ github.sha }} -t ${{ env.REGISTRY }}:latest .
          docker push ${{ env.REGISTRY }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.REGISTRY }}:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=3 \
            --timeout=60 \
            --set-secrets="UAZAPI_INSTANCE_TOKEN=UAZAPI_INSTANCE_TOKEN:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,SETUP_SECRET=SETUP_SECRET:latest,TELEGRAM_WEBHOOK_SECRET_TOKEN=TELEGRAM_WEBHOOK_SECRET_TOKEN:latest,UAZAPI_WEBHOOK_SECRET=UAZAPI_WEBHOOK_SECRET:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY_EFINANCE:latest,GEMINI_API_KEY=GEMINI_API_KEY_EFINANCE:latest,SCHEDULER_SECRET=SCHEDULER_SECRET:latest,SUPABASE_URL=SUPABASE_URL_EFINANCE:latest" \
            --set-env-vars="^@@^UAZAPI_SERVER_URL=https://processai.uazapi.com@@AI_NATIVE_ENABLED=true@@TRACE_ENABLED=true@@ASSISTANT_SESSION_READ_TIMEOUT_MS=25000@@BOT_BASE_URL=https://e-finance-bot-oh6s7bvufq-rj.a.run.app@@PLATFORM_PIX_KEY=45448618000157@@PLATFORM_PIX_KEY_TYPE=CNPJ@@PLATFORM_PIX_NAME=GRUPO SS@@PLATFORM_PIX_CITY=Mossoró@@SUBSCRIPTION_AMOUNT_CADERNETA=150@@SUBSCRIPTION_REMINDER_LEAD_DAYS=3@@SUBSCRIPTION_REMINDER_GRACE_DAYS=7@@SUPPORT_FORWARD_PHONE=5585991318582"

      - name: Warm up new revision (evita cold-start na 1ª request real)
        # Cold start de container novo causa session_sync_timeout (15s+ no
        # 1º round-trip Supabase). 5 hits no /health forçam o container a
        # subir e fazer initial connect ao Supabase antes do tráfego real.
        run: |
          URL="https://e-finance-bot-oh6s7bvufq-rj.a.run.app"
          for i in 1 2 3 4 5; do
            curl -fsS -m 30 "$URL/health" -o /dev/null -w "warmup #$i: %{time_total}s\n" || true
            sleep 1
          done

      - name: Ensure public ingress (allUsers invoker)
        # gcloud run deploy --allow-unauthenticated falha silenciosamente quando há
        # org policy iam.allowedPolicyMemberDomains restritiva. Garantir o binding
        # explicitamente após cada deploy mantém os webhooks UazAPI/Telegram acessíveis.
        run: |
          gcloud run services add-iam-policy-binding ${{ env.SERVICE }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --quiet

      - name: Configure webhooks (UazAPI + Telegram)
        # BOT_BASE_URL já vem fixado no --set-env-vars do deploy → este step
        # não cria mais 2ª revisão (que adicionava cold-start extra).
        run: |
          URL="https://e-finance-bot-oh6s7bvufq-rj.a.run.app"
          SETUP_SECRET_VALUE=$(gcloud secrets versions access latest --secret=SETUP_SECRET --project=${{ env.PROJECT_ID }})
          curl -fsS -X POST "$URL/setup" \
            -H "Content-Type: application/json" \
            -H "x-setup-secret: ${SETUP_SECRET_VALUE}" \
            -d '{}' | grep -q '"status":"done"'
